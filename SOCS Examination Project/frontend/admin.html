<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View — SOCS Exam</title>
    <style>
        :root {
            --blue: #1e4ba0;
            --blue-lt: #e8eef8;
            --green: #0e8c4b;
            --red: #c0392b;
            --gray: #6b7280;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --card: #fff
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: #1a202c;
            min-height: 100vh
        }

        header {
            background: var(--blue);
            color: #fff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        header .ico {
            font-size: 26px
        }

        header h1 {
            font-size: 17px;
            font-weight: 700
        }

        header p {
            font-size: 11px;
            opacity: .8;
            margin-top: 2px
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 18px 16px 50px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden
        }

        .card-hdr {
            padding: 12px 16px;
            background: var(--blue-lt);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 13px;
            color: var(--blue);
            display: flex;
            align-items: center;
            gap: 8px
        }

        .dr {
            display: flex;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            font-size: 13px
        }

        .dr:last-child {
            border-bottom: none
        }

        .dl {
            width: 130px;
            flex-shrink: 0;
            font-size: 11px;
            color: var(--gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .dv {
            font-weight: 500;
            word-break: break-word
        }

        .res-entry {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border)
        }

        .res-entry:last-child {
            border-bottom: none
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 8px
        }

        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            border-radius: 8px;
            padding: 8px 4px
        }

        .stat .num {
            font-size: 22px;
            font-weight: 800
        }

        .stat .lbl {
            font-size: 10px;
            color: var(--gray);
            margin-top: 2px
        }

        .sheets .num {
            color: var(--blue)
        }

        .ufm .num {
            color: var(--red)
        }

        .absent .num {
            color: #b45309
        }

        .meta {
            font-size: 11px;
            color: var(--gray);
            margin-top: 6px
        }

        .empty {
            text-align: center;
            padding: 26px;
            color: var(--gray);
            font-size: 13px
        }

        #loader {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            font-size: 14px
        }

        .spin {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 10px
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .err-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            color: var(--red);
            font-weight: 600;
            margin-top: 30px
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: #dbeafe;
            color: var(--blue);
            margin-left: auto
        }
    </style>
</head>

<body>
    <header>
        <div class="ico">🔐</div>
        <div>
            <h1>Admin View — Exam Details</h1>
            <p>SOCS — UPES Dehradun &nbsp;(Restricted)</p>
        </div>
    </header>
    <div class="wrap">
        <div id="loader">
            <div class="spin"></div><br>Loading…
        </div>
        <div id="content" style="display:none"></div>
    </div>
    <script>
        const API = 'http://' + location.hostname + ':5000/api';
        function p(n) { return new URLSearchParams(location.search).get(n); }
        function fmt(v) { return v || '—'; }

        function renderResults(rs) {
            if (!rs || !rs.length) return '<div class="empty">No results submitted yet.</div>';
            return rs.map(r => `
    <div class="res-entry">
      <div class="stats">
        <div class="stat sheets"><span class="num">${r.answer_sheets}</span><span class="lbl">Sheets</span></div>
        <div class="stat ufm"><span class="num">${r.ufm_count}</span><span class="lbl">UFM</span></div>
        <div class="stat absent"><span class="num">${r.absent_count}</span><span class="lbl">Absent</span></div>
      </div>
      ${r.remarks ? `<div class="meta">📝 ${r.remarks}</div>` : ''}
      <div class="meta">🕐 ${new Date(r.submitted_at).toLocaleString()}${r.submitted_by ? ' · By: ' + r.submitted_by : ''}</div>
    </div>`).join('');
        }

        function render(d) {
            document.getElementById('loader').style.display = 'none';
            const c = document.getElementById('content'); c.style.display = 'block';
            c.innerHTML = `
    <div class="card">
      <div class="card-hdr">🏫 Examination Details <span class="badge">ID #${d.id}</span></div>
      ${[['Exam Title', d.exam_title], ['Room No.', d.room_number], ['Date', d.exam_date], ['Time', d.exam_time],
                ['Program/Batch', d.program_batch], ['Semester', d.semester], ['Course', d.course_name],
                ['Code', d.course_code], ['Evaluator', d.evaluator_name], ['Students Enrolled', d.num_students]]
                    .map(([l, v]) => `<div class="dr"><div class="dl">${l}</div><div class="dv">${fmt(v)}</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-hdr">📊 Submitted Results</div>
      ${renderResults(d.results)}
    </div>`;
        }

        async function load() {
            const id = p('exam_id');
            if (!id) { document.getElementById('loader').innerHTML = '<div class="err-box">❌ No exam_id in URL.</div>'; return; }
            try {
                const r = await fetch(`${API}/admin/exam/${id}`);
                const d = await r.json();
                if (!r.ok) { document.getElementById('loader').innerHTML = `<div class="err-box">❌ ${d.error}</div>`; return; }
                render(d);
            } catch (err) {
                document.getElementById('loader').innerHTML = `<div class="err-box">❌ Cannot connect to server.<br><small>${err.message}</small></div>`;
            }
        }
        load();
    </script>
</body>

</html>
