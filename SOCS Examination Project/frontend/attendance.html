<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Input</title>
    <style>
        :root {
            --green: #0e8c4b;
            --green-lt: #ecfdf5;
            --red: #c0392b;
            --blue: #1e4ba0;
            --gray: #6b7280;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: #1a202c;
            min-height: 100vh;
        }

        header {
            background: var(--green);
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .icon {
            font-size: 28px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        header p {
            font-size: 12px;
            opacity: .8;
            margin-top: 2px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .card-header {
            padding: 14px 18px;
            background: var(--green-lt);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 14px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── student info (read-only) ── */
        .info-row {
            display: flex;
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            width: 110px;
            flex-shrink: 0;
            font-size: 12px;
            color: var(--gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 500;
        }

        /* ── form ── */
        .form-body {
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .counter-row {
            display: flex;
            gap: 14px;
        }

        .counter-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .counter-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .counter-ctrl {
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .counter-ctrl button {
            background: var(--bg);
            border: none;
            font-size: 20px;
            font-weight: 700;
            width: 42px;
            height: 48px;
            cursor: pointer;
            color: var(--gray);
            transition: background .15s;
        }

        .counter-ctrl button:hover {
            background: #e5e7eb;
        }

        .counter-ctrl input {
            flex: 1;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            outline: none;
            background: #fff;
            height: 48px;
            -moz-appearance: textfield;
        }

        .counter-ctrl input::-webkit-inner-spin-button,
        .counter-ctrl input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .present-group .counter-ctrl {
            border-color: #86efac;
        }

        .present-group input {
            color: var(--green);
        }

        .absent-group .counter-ctrl {
            border-color: #fca5a5;
        }

        .absent-group input {
            color: var(--red);
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 6px;
        }

        .field input,
        .field textarea {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--green);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #0a7a40;
        }

        .submit-btn:active {
            transform: scale(.98);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* ── feedback ── */
        #feedback {
            display: none;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-top: 4px;
        }

        #feedback.success {
            background: var(--green-lt);
            border: 1px solid #86efac;
            color: var(--green);
        }

        #feedback.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--red);
        }

        #feedback .big-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        #feedback h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        #feedback p {
            font-size: 13px;
            opacity: .85;
        }

        /* loading / error skeleton */
        #loader {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            font-size: 15px;
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: var(--red);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <header>
        <div class="icon">📋</div>
        <div>
            <h1>Attendance Input</h1>
            <p>Record present and absent students</p>
        </div>
    </header>

    <div class="container">
        <div id="loader">
            <div class="spinner"></div><br>
            Loading examination data…
        </div>
        <div id="content" style="display:none"></div>
    </div>

    <script>
        const API = 'http://' + location.hostname + ':5000/api';

        function getParam(name) {
            return new URLSearchParams(location.search).get(name);
        }

        let examId = null;

        function counter(inputId, delta) {
            const inp = document.getElementById(inputId);
            const val = parseInt(inp.value, 10) || 0;
            inp.value = Math.max(0, val + delta);
        }

        async function submitAttendance(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');

            const present = parseInt(document.getElementById('presentCount').value, 10) || 0;
            const absent = parseInt(document.getElementById('absentCount').value, 10) || 0;
            const remarks = document.getElementById('remarks').value.trim();
            const by = document.getElementById('submittedBy').value.trim();

            btn.disabled = true;
            btn.innerHTML = '⏳ Submitting…';

            try {
                const resp = await fetch(`${API}/attendance/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam_id: examId,
                        present_count: present,
                        absent_count: absent,
                        remarks,
                        submitted_by: by,
                    }),
                });
                const data = await resp.json();

                const fb = document.getElementById('feedback');
                fb.style.display = 'block';

                if (resp.ok) {
                    fb.className = 'success';
                    fb.innerHTML = `
          <div class="big-icon">✅</div>
          <h3>Attendance Recorded!</h3>
          <p>Present: <strong>${present}</strong> &nbsp;|&nbsp; Absent: <strong>${absent}</strong></p>
          ${remarks ? `<p style="margin-top:6px">📝 ${remarks}</p>` : ''}
        `;
                    document.getElementById('attendanceForm').reset();
                    document.getElementById('presentCount').value = 0;
                    document.getElementById('absentCount').value = 0;
                    btn.innerHTML = '✅ Submitted';
                    setTimeout(() => { btn.disabled = false; btn.innerHTML = '✔ Submit Attendance'; fb.style.display = 'none'; }, 4000);
                } else {
                    fb.className = 'error';
                    fb.innerHTML = `<div class="big-icon">❌</div><h3>Error</h3><p>${data.error}</p>`;
                    btn.disabled = false;
                    btn.innerHTML = '✔ Submit Attendance';
                }
            } catch (err) {
                const fb = document.getElementById('feedback');
                fb.style.display = 'block';
                fb.className = 'error';
                fb.innerHTML = `<div class="big-icon">❌</div><h3>Connection Error</h3><p>${err.message}</p>`;
                btn.disabled = false;
                btn.innerHTML = '✔ Submit Attendance';
            }
        }

        function renderPage(exam) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="card-header">👤 Examination Info</div>
        ${[
                    ['Student', exam.student_name],
                    ['Subject', exam.subject],
                    ['Date', exam.exam_date || '—'],
                    ['Room', exam.room_number || '—'],
                    ['Seat', exam.seat_number || '—'],
                ].map(([l, v]) => `
          <div class="info-row">
            <div class="info-label">${l}</div>
            <div class="info-value">${v}</div>
          </div>`).join('')}
      </div>

      <div class="card">
        <div class="card-header">📊 Enter Attendance</div>
        <form id="attendanceForm" class="form-body" onsubmit="submitAttendance(event)">
          <div class="counter-row">
            <div class="counter-group present-group">
              <label>✅ Present</label>
              <div class="counter-ctrl">
                <button type="button" onclick="counter('presentCount',-1)">−</button>
                <input id="presentCount" type="number" value="0" min="0">
                <button type="button" onclick="counter('presentCount', 1)">+</button>
              </div>
            </div>
            <div class="counter-group absent-group">
              <label>❌ Absent</label>
              <div class="counter-ctrl">
                <button type="button" onclick="counter('absentCount',-1)">−</button>
                <input id="absentCount" type="number" value="0" min="0">
                <button type="button" onclick="counter('absentCount', 1)">+</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label>Submitted By (optional)</label>
            <input id="submittedBy" type="text" placeholder="Invigilator name…">
          </div>

          <div class="field">
            <label>Remarks (optional)</label>
            <textarea id="remarks" rows="3" placeholder="Any notes about this session…"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="submit-btn">
            ✔ Submit Attendance
          </button>

          <div id="feedback"></div>
        </form>
      </div>
    `;
        }

        async function load() {
            examId = getParam('exam_id');
            if (!examId) {
                document.getElementById('loader').innerHTML =
                    '<div class="error-box">❌ No exam ID provided in URL.</div>';
                return;
            }

            try {
                const resp = await fetch(`${API}/examination/${examId}`);
                const data = await resp.json();

                if (!resp.ok) {
                    document.getElementById('loader').innerHTML =
                        `<div class="error-box">❌ ${data.error}</div>`;
                    return;
                }

                renderPage(data);
            } catch (err) {
                document.getElementById('loader').innerHTML =
                    `<div class="error-box">❌ Cannot connect to server.<br><small>${err.message}</small></div>`;
            }
        }

        load();
    </script>
</body>

</html>
